p{margin:0;font-size:clamp(11px,2vw,16px)}

if(e.k=='h'){if(g.y>=G-3&&Math.abs(e.x-PX)<e.w/2-12){if(S.lv>=6){doom();return}hurt('SPLOTCH ! Nid-de-poule');}continue}
if(pr.x<bx.x+bx.w&&pr.x+pr.w>bx.x&&pr.y<bx.y+bx.h&&pr.y+pr.h>bx.y){
if(S.lv>=6&&(e.k=='o'||e.k=='x')){doom();return}
if(e.k=='o'){if(g.turbo>0){e.dead=1;g.score+=50;txt('BOUM +50',e.x,e.y,'#e8c32e');puff(e.x,e.y,8);tone(150,.2,'square',.15,40)}else{hurt(QUIPS[Math.random()*QUIPS.length|0]);e.dead=1}}
else if(e.k=='b'){e.dead=1;g.beans++;g.gas=Math.min(mx(),g.gas+18);tone(700+g.beans%5*60,.08,'square',.08)}
else if(e.k=='s'){e.dead=1;g.score+=60;txt('+60 Baguette',e.x,e.y,'#e8c32e');tone(880,.12,'triangle',.12)}
else if(e.k=='c'){e.dead=1;g.turbo=6;g.gas=mx();g.ban={s:'MODE CASSOULET !',t:2};tone(200,.6,'sawtooth',.15,900)}}}
g.ents=g.ents.filter(e=>!e.dead&&e.x>-160);
for(const p of g.parts){p.x+=(p.vx-v)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.a-=dt*.9}g.parts=g.parts.filter(p=>p.a>0);
for(const t of g.txt){t.x-=v*dt*.6;t.y-=40*dt;t.a-=dt*.8}g.txt=g.txt.filter(t=>t.a>0)}
/* draw */
function draw(){const L=LV[g.lv];X.save();if(g.shake>0)X.translate(R(-5,5),R(-5,5));
const gr=X.createLinearGradient(0,0,0,G);gr.addColorStop(0,L.s[0]);gr.addColorStop(1,L.s[1]);X.fillStyle=gr;X.fillRect(0,0,W,H);
X.textAlign='center';X.textBaseline='middle';X.font='54px serif';X.fillText(L.o,640,70);
const off=g.x*.15;X.fillStyle=L.f;for(let i=-1;i<10;i++){const k=Math.floor(off/90)+i,x=k*90-off,h=40+hs(k)*(L.hill?50:130);X.beginPath();if(L.hill){X.ellipse(x+45,G-40,70,h,0,Math.PI,0);X.fill()}else X.fillRect(x,G-40-h,80,h+1)}
const o2=g.x*.4;X.font='46px serif';X.textBaseline='bottom';for(let i=-1;i<8;i++){const k=Math.floor(o2/130)+i;if(hs(k+9)>.35)X.fillText(L.d[Math.floor(hs(k)*5)],k*130-o2+40,G-42)}
X.fillStyle=L.w;X.fillRect(0,G-44,W,14);X.fillStyle=L.r;X.fillRect(0,G-30,W,H);
X.fillStyle='#e8c32e';const ro=g.x%80;for(let x=-ro;x<W;x+=80)X.fillRect(x,G+50,40,5);
X.textBaseline='middle';
for(const e of g.ents){if(e.k=='h'){X.fillStyle='#0d0d10';X.beginPath();X.ellipse(e.x,G+6,e.w/2,9,0,0,7);X.fill();continue}
if(e.k=='t'){const n=!e.h&&Math.abs(e.x-PX)<150;X.fillStyle=e.h?'rgba(143,191,42,.4)':'rgba(255,255,255,.45)';X.beginPath();X.arc(e.x,e.y,38,0,7);X.fill();if(n){X.strokeStyle='#e8c32e';X.lineWidth=4;X.setLineDash([8,6]);X.beginPath();X.arc(e.x,e.y,38+Math.sin(tick*10)*3,0,7);X.stroke();X.setLineDash([])}}
X.font=(e.k=='t'?62:e.h*1.05)+'px serif';X.fillText(e.e,e.x,e.y)}
for(const p of g.parts){X.fillStyle='rgba('+p.c+','+Math.max(0,p.a*.6)+')';X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill()}
/* joueur */
if(!(g.inv>0&&Math.floor(g.inv*14)%2)){const rn=g.y>=G,sw=rn?Math.sin(g.t*16)*9:6,y=g.y;
X.strokeStyle='#2b2016';X.lineWidth=6;X.lineCap='round';X.beginPath();X.moveTo(PX,y-14);X.lineTo(PX+sw,y);X.moveTo(PX,y-14);X.lineTo(PX-sw,y-2);X.stroke();
X.fillStyle=g.turbo>0?'#e8c32e':'#e2553d';X.beginPath();X.roundRect(PX-12,y-34,24,22,6);X.fill();
X.fillStyle='#4a6fa5';X.fillRect(PX-12,y-17,24,6);
if(g.fl>0){X.font='26px serif';X.fillText('💨',PX-30,y-14)}
X.font='34px serif';X.fillText(st=='over'?'😵':g.turbo>0?'😎':g.fl>0?'😮‍💨':g.inv>0?'😖':'😬',PX,y-44)}
for(const t of g.txt){X.globalAlpha=Math.max(0,t.a);X.font='bold 18px Verdana';X.lineWidth=4;X.strokeStyle='#2b2016';X.strokeText(t.s,t.x,t.y);X.fillStyle=t.c;X.fillText(t.s,t.x,t.y)}X.globalAlpha=1;
X.restore();
if(st!='menu')hud(L)}
function T(s,x,y,sz,c,al){X.font='bold '+sz+'px Verdana';X.textAlign=al||'left';X.lineWidth=4;X.strokeStyle='#2b2016';X.strokeText(s,x,y);X.fillStyle=c||'#fff';X.fillText(s,x,y)}
function hud(L){X.textBaseline='middle';X.font='20px serif';X.textAlign='left';for(let i=0;i<3;i++){X.globalAlpha=i<g.hp?1:.25;X.fillText('❤️',12+i*26,22)}X.globalAlpha=1;
const gw=170,p=g.gas/mx();X.fillStyle='rgba(0,0,0,.55)';X.fillRect(12,42,gw+4,18);X.fillStyle=g.turbo>0?'#e8c32e':p>.5?'#8fbf2a':p>.2?'#c8a028':'#8a4b1a';if(!(p<.2&&Math.floor(tick*6)%2))X.fillRect(14,44,gw*p,14);
T('GAZ',16,52,12,'#fff');T('🫘 '+g.beans+'  Niv. '+S.lv,12,76,16);
T(Math.floor(g.score)+' pts',W-12,20,22,'#e8c32e','right');T(Math.floor(g.x/40)+' m',W-12,46,15,'#fff','right');
if(g.combo>1)T('COMBO x'+g.combo,W-12,70,16,'#8fbf2a','right');
if(g.turbo>0)T('CASSOULET '+g.turbo.toFixed(1)+'s',W/2,24,18,'#e8c32e','center');
if(g.ban){X.globalAlpha=Math.min(1,g.ban.t);T(g.ban.s,W/2,150,34,'#fff','center');X.globalAlpha=1}
if(st=='play'&&g.t<5){T('ESPACE / TOUCHE = PROUT  💨',W/2,230,18,'#fff','center');T('Prouter près des passants = combo. Les haricots rechargent le gaz.',W/2,256,13,'#fff','center')}}
/* ui */
const ui=$('ui');
function menu(){st='menu';ui.style.background='';ui.style.display='flex';let sh='';UP.forEach((u,i)=>{const l=S.up[i];sh+=`<div class="c"><b>${u[1]} ${u[0]}</b><br>${u[2]}<br><span class="pip">${'■'.repeat(l)+'□'.repeat(5-l)}</span><br>${l>=5?'<b>MAX</b>':`<button onclick="buy(${i})" ${S.b<cost(l)?'disabled':''}>Acheter · ${cost(l)} 🫘</button>`}</div>`});
ui.innerHTML=`<h1>PROUT PROUT<small>MACADAM</small></h1><p>Propulse-toi à coups de prouts, esquive la circulation, <br>fais s'évanouir les passants et collectionne les haricots.</p><button onclick="start()">▶ Jouer</button>${asc()}<p>Record : <b>${S.best}</b> pts · Haricots : <b>${S.b} 🫘</b> · Courses : ${S.runs}</p><div class="g">${sh}</div>${lb()}`}
function overUI(sc){const rk=RANK.filter(r=>sc>=r[0]).pop()[1];ui.style.display='flex';ui.innerHTML=`<h1>Dignité perdue</h1><p style="font-size:clamp(14px,3vw,24px)"><b>${sc}</b> pts · ${Math.floor(g.x/40)} m · +${g.beans} 🫘 · ${g.near} passants K.O.${sc>=S.best&&sc>0?' · <b style="color:#8fbf2a">NOUVEAU RECORD !</b>':''}</p><p>Ton rang : <b style="color:#e8c32e">${rk}</b></p><button onclick="start()">↻ Rejouer</button><button onclick="menu()">🛒 Boutique</button>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setName(v){S.name=v.trim().slice(0,14)||'Toi';save();menu()}
function lb(){const rv=[];
let h='<div class="c lb"><b>🏆 Classement</b>';
h+='<div class="r bob"><span>1. 👑 Le Grand Prout Bob</span><span>niv. 1 000 000 · ∞ pts</span></div>';
rv.forEach((r,i)=>{h+='<div class="r'+(r[3]?' me':'')+'"><span>'+(i+2)+'. '+esc(r[0])+'</span><span>niv. '+r[1]+' · '+r[2]+' pts</span></div>'});return h+'</div>'}
function asc(){const l=S.lv;if(l>=6)return `<div class="c" style="text-align:center;width:min(92%,640px)"><b>👑 ${PN[6]}</b><br>Niveau maximum atteint : score ×${pm().toFixed(2)}. Ose lancer une course, si tu l'oses...</div>`;return `<div class="c" style="text-align:center;width:min(92%,640px)"><b>Niveau ${l} · ${PN[l]}</b> (score ×${pm().toFixed(2)})<br>Atteindre le niveau ${l+1} : <b>${+(PL[l]*100).toFixed(1)}%</b> de chances<br><button onclick="tryUp()" ${S.b<PC[l]?'disabled':''}>⚡ Tenter · ${PC[l]} 🫘</button><br><span style="color:#e8c32e">${am}</span></div>`}
function tryUp(){au();const l=S.lv;if(l>=6||S.b<PC[l])return;S.b-=PC[l];if(Math.random()<PL[l]){S.lv++;am='🎉 SUCCÈS ! Niveau '+S.lv+' : '+PN[S.lv];tone(500,.5,'triangle',.15,1200);fart()}else{am='💨 Raté, un simple faux prout. '+PC[l]+' 🫘 perdus.';tone(300,.4,'sawtooth',.15,60)}save();menu()}
function buy(i){const l=S.up[i];if(l<5&&S.b>=cost(l)){S.b-=cost(l);S.up[i]++;save();tone(600,.2,'triangle',.12,1000);menu()}}
/* input */
addEventListener('keydown',e=>{if(e.repeat)return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(st=='play')prout()}else if(e.code=='Enter'&&st!='play'&&ui.querySelector('button'))ui.querySelector('button').click()});
$('w').addEventListener('pointerdown',e=>{if(st=='play'&&e.target.id!='m'){e.preventDefault();prout()}});
$('m').onclick=()=>{mute=!mute;$('m').textContent=mute?'🔇':'🔊'};
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;tick+=dt;if(st=='play')upd(dt);else if(st=='menu'){g.x+=120*dt;g.t+=dt}else{g.t+=dt}draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
